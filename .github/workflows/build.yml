name: Build iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        type: choice
        default: Release
        options: [Release, Debug]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WeBox (${{ github.event.inputs.configuration || 'Release' }})
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write

    env:
      PROJECT: WeBox.xcodeproj
      SCHEME: WeBox
      CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
      # Optional signing assets. Leave unset to produce an unsigned IPA.
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      EXPORT_METHOD: ${{ secrets.EXPORT_METHOD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Validate project file
        run: python3 scripts/validate_project.py

      - name: Swift structural check
        run: python3 scripts/check_swift.py

      - name: Build (unsigned)
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee dist/xcodebuild.log

      - name: Package unsigned IPA / tipa
        run: |
          chmod +x scripts/package_ipa.sh
          bash scripts/package_ipa.sh "$CONFIGURATION"

      - name: Import signing certificate
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f certificate.p12
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          rm -f profile.mobileprovision

      - name: Archive and export signed IPA
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        run: |
          set -euo pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD:-development}</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.webox.ios</key>
              <string>$PROVISIONING_PROFILE_SPECIFIER</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/WeBox.xcarchive \
            -derivedDataPath build \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
            archive
          xcodebuild -exportArchive \
            -archivePath build/WeBox.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath dist/signed

      - name: Upload unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WeBox-unsigned-${{ github.sha }}
          path: |
            dist/*.ipa
            dist/*.tipa
            dist/xcodebuild.log
          if-no-files-found: warn

      - name: Upload signed IPA
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: WeBox-signed-${{ github.sha }}
          path: dist/signed/*.ipa
          if-no-files-found: warn

      - name: Publish failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/publish_failure.sh
          bash scripts/publish_failure.sh

      - name: Publish build report
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/publish_build_report.sh
          bash scripts/publish_build_report.sh

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/publish_release.sh
          bash scripts/publish_release.sh
